name: Validate Turbo Decky

on:
  push:
    branches:
      - 'validation/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n InstallTD.sh
          for file in lib/*.sh tests/*.sh; do
            bash -n "$file"
          done

      - name: Validate profiles and reversal
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-installtd.sh ./InstallTD.sh

      - name: Reject ZRAM recompression runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RniE 'OnUnitActiveSec=|OnCalendar=|recomp_algorithm|recompress=' \
            InstallTD.sh lib tests
          grep -Fq 'compression-algorithm = lz4 zstd' lib/10-profiles.sh

      - name: Verify Charcoal profile anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'vm.swappiness=200' lib/00-core.sh
          grep -Fq 'vm.dirty_background_bytes=268435456' lib/00-core.sh
          grep -Fq 'transparent_hugepage/defrag - - - - defer' lib/00-core.sh
          grep -Fq 'max_ptes_none - - - - 64' lib/00-core.sh
          grep -Fq 'max_ptes_swap - - - - 0' lib/00-core.sh
