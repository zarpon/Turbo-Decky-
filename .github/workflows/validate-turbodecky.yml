name: Validate Turbo Decky

on:
  push:
    branches:
      - 'validation/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbodecky-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n InstallTD.sh
          for file in lib/*.sh tests/*.sh packaging/appimage/AppRun \
            packaging/appimage/turbodecky packaging/appimage/*.sh; do
            bash -n "$file"
          done

      - name: Validate profiles and reversal
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-installtd.sh ./InstallTD.sh

      - name: Validate reboot persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-persistence.sh ./InstallTD.sh

      - name: Validate ZSWAP runtime guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-zswap-runtime-guard.sh ./InstallTD.sh

      - name: Validate progress UI
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-progress-ui.sh ./InstallTD.sh

      - name: Validate AppImage layout
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/test-appimage-layout.sh

      - name: Reject ZRAM recompression runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RniE 'OnUnitActiveSec=|OnCalendar=|recomp_algorithm|recompress=' \
            InstallTD.sh lib packaging/appimage/AppRun packaging/appimage/turbodecky
          grep -Fq 'compression-algorithm = lz4 zstd' lib/10-profiles.sh

      - name: Verify Charcoal profile anchors
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Eq '^[[:space:]]*"vm\.swappiness=' lib/00-core.sh
          grep -Fq 'vm.min_free_kbytes=262144' lib/00-core.sh
          grep -Fq 'vm.dirty_background_bytes=209715200' lib/00-core.sh
          grep -Fq 'kernel.split_lock_mitigate=0' lib/00-core.sh
          grep -Fq 'transparent_hugepage/defrag - - - - defer+madvise' lib/00-core.sh
          grep -Fq 'max_ptes_none - - - - 384' lib/00-core.sh
          grep -Fq 'max_ptes_swap - - - - 16' lib/00-core.sh

  package-appimage:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          bash packaging/appimage/build-appimage.sh

      - name: Smoke-test generated AppImage
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(find dist -maxdepth 1 -type f -name 'TurboDecky-*-x86_64.AppImage' -print -quit)"
          [[ -n "$image" && -x "$image" ]]
          image_name="$(basename "$image")"
          ! grep -q '/' "dist/$image_name.sha256"
          (cd dist && sha256sum -c "$image_name.sha256")
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version | grep -Eq '^[0-9]+\.[0-9]+'

      - name: Validate release assets
        shell: bash
        env:
          DRY_RUN: '1'
          RELEASE_TAG: Latest
        run: |
          set -Eeuo pipefail
          bash packaging/appimage/publish-release.sh
          [[ -x dist/TurboDecky-x86_64.AppImage ]]
          ! grep -q '/' dist/TurboDecky-x86_64.AppImage.sha256
          (cd dist && sha256sum -c TurboDecky-x86_64.AppImage.sha256)

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboDecky-AppImage-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
